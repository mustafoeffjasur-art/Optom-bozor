<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Optom Bozor</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f5c4d"><link rel="icon" href="icon-192.png">
<style>
:root{--bg:#edf1ef;--c:#fff;--ink:#12211d;--mut:#5d6f69;--br:#0f5c4d;--ac:#ff7a1a;--ln:#d5dedb;--ok:#18864b;--er:#c93a2b}
[data-th=d]{--bg:#0d1513;--c:#16211e;--ink:#e6efec;--mut:#8fa59e;--br:#3fbf9f;--ln:#26342f}
*{box-sizing:border-box;margin:0}
body{font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:0 0 76px}
main{padding:10px 12px;max-width:640px;margin:auto}
small{color:var(--mut);font-size:12.5px;display:block}
.hd{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--br);color:#fff;position:sticky;top:0;z-index:5}
[data-th=d] .hd{color:#06241c}.hd small{color:inherit;opacity:.8}.hd b{font-size:19px}
.dot{font-size:12px;padding:3px 9px;border-radius:99px;background:rgba(0,0,0,.25)}.dot.on{background:#18864b;color:#fff}
.in{width:100%;padding:10px;border:1.5px solid var(--ln);border-radius:10px;background:var(--c);color:var(--ink);font:inherit;margin:4px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}.row>.in{flex:1;min-width:90px}.sp{flex:1}
.ch{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
.chip{white-space:nowrap;border:1.5px solid var(--ln);background:var(--c);color:var(--ink);border-radius:99px;padding:6px 12px;font:inherit}
.chip.on{background:var(--br);border-color:var(--br);color:#fff}
.b{border:0;border-radius:10px;padding:9px 12px;background:var(--br);color:#fff;font:600 14px system-ui}
[data-th=d] .b{color:#06241c}.b.o{background:transparent;color:var(--br);border:1.5px solid var(--br)}.b.a{background:var(--ac);color:#111}.b.r{background:var(--er);color:#fff}
.cd{background:var(--c);border:1px solid var(--ln);border-radius:14px;padding:12px;margin:8px 0}
.top{display:flex;justify-content:space-between;gap:8px}.pr{font:700 20px Georgia,serif;margin:6px 0 2px}.pr small{display:inline}
.ti{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}.ti span{font-size:12px;background:var(--bg);border-radius:6px;padding:3px 7px}
.bd{background:var(--ac);color:#111;font:700 11px system-ui;border-radius:6px;padding:3px 7px;height:fit-content;white-space:nowrap}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:8px 0;font:12px system-ui;position:relative}
nav button.on{color:var(--br);font-weight:700}nav i{display:block;font-style:normal;font-size:20px}
nav em{position:absolute;top:3px;left:55%;background:var(--ac);color:#111;border-radius:99px;font:700 10px system-ui;padding:1px 5px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:20}
.sh{background:var(--c);width:100%;max-height:80vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px;max-width:640px;margin:auto}
#ts{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;z-index:30;display:none}
.bar{height:6px;background:var(--ln);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ok)}
.st{display:grid;grid-template-columns:1fr 1fr;gap:8px}.st .cd{margin:0}.st b{font:700 18px Georgia,serif}
.bars{display:flex;gap:5px;align-items:flex-end;height:60px}.bars i{flex:1;background:var(--br);border-radius:4px 4px 0 0;min-height:2px}
.neg{color:var(--er)}.pos{color:var(--ok)}h3{margin:14px 0 4px}
nav button{font-size:11px}nav i{transition:transform .3s}nav button.on i{transform:translateY(-3px) scale(1.2)}
a.b{display:inline-block;text-decoration:none}
.pg{animation:fadein .35s both}.pg .cd{animation:rise .5s both}.pg .cd:nth-child(2){animation-delay:.06s}.pg .cd:nth-child(3){animation-delay:.12s}.pg .cd:nth-child(4){animation-delay:.18s}.pg .cd:nth-child(n+5){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97)}}@keyframes fadein{from{opacity:0}}@keyframes pulse{50%{opacity:.55;transform:scale(1.06)}}@keyframes flo{50%{transform:translateY(-6px)}}@keyframes shn{to{background-position:-200% 0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}}@keyframes sheet{from{transform:translateY(100%)}}@keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.pulse{animation:pulse 1.3s infinite}.sh{animation:sheet .3s}.ov{animation:fadein .2s}.b{transition:transform .12s}.b:active{transform:scale(.93)}.chip,.cd{transition:transform .2s,box-shadow .2s}.cd:active{transform:scale(.985)}
.glow{box-shadow:0 0 0 1.5px var(--ac),0 6px 22px rgba(255,122,26,.25)}
.shine{background:linear-gradient(110deg,var(--ac) 40%,#ffd08a 50%,var(--ac) 60%);background-size:200% 100%;animation:shn 2.2s linear infinite;width:100%;margin:5px 0}
.av{width:42px;height:42px;border-radius:50%;color:#fff;display:grid;place-items:center;font:700 18px system-ui;animation:pop .4s}
.ads{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 0 10px}.ad{flex:0 0 70%;scroll-snap-align:start;background:var(--c);border:1px solid var(--ln);border-radius:14px;padding:12px;position:relative}.ad .em{font-size:40px;animation:flo 3s infinite}.ad .tag{position:absolute;top:8px;right:8px;font-size:10px;color:var(--mut)}.dc{background:var(--er);color:#fff;border-radius:6px;padding:2px 7px;font:700 12px system-ui}
.pw,.tr{text-align:center}.crown,.big{font-size:56px;animation:flo 2.5s infinite}.pw ul{text-align:left;margin:10px 0 10px 22px}.tr .big{animation:pop .5s}.dots i{display:inline-block;width:8px;height:8px;border-radius:9px;background:var(--ln);margin:6px 3px;transition:.3s}.dots i.on{width:22px;background:var(--ac)}
#gate{position:fixed;inset:0;z-index:50;background:linear-gradient(160deg,#0f5c4d,#0a2e27);display:grid;place-items:center;padding:20px;overflow:hidden}.orb{position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(#ff7a1a66,transparent 70%);animation:flo 6s infinite}
.gc{position:relative;text-align:center;color:#fff;width:100%;max-width:360px;animation:rise .7s both}.gc h1{font:700 32px Georgia,serif}.gc p{opacity:.85;margin:8px 0 20px}.gc small{color:#cfe;margin-top:12px}.logo{font-size:64px;animation:flo 3s infinite}.gc .b{width:100%;margin:5px 0;color:#fff;border-color:#fff}
.gb{display:block;width:100%;border:0;border-radius:12px;padding:13px;margin:8px 0;font:600 16px system-ui}.gb.g{background:#fff;color:#222}.gb.f{background:#1877f2;color:#fff}
#sp{position:fixed;inset:0;z-index:60;background:#0f5c4d;display:grid;place-items:center;font-size:72px;animation:fadein .2s;transition:opacity .5s}
.cf{position:fixed;top:60%;width:9px;height:14px;z-index:70;animation:cf 1.3s ease-out forwards}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="hd"></div><main id="app"></main><nav id="tb"></nav><div id="md"></div><div id="ts"></div>
<script>
const $=s=>document.querySelector(s),K="optom_v1";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Math.round(n).toLocaleString("ru-RU").replace(/[\u00a0\u202f]/g," ")+" so‘m";
const rid=()=>Math.random().toString(36).slice(2,9);
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{fav:[],cart:{},orders:[],wh:[],sales:[],market:[],last:"",cfg:{db:"",room:"",dark:0,shop:"Mening do‘konim",name:"",phone:"",addr:""}};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
function seed(){const sh=[["Baraka Optom","Toshkent",4.8,1],["Samarqand Ulgurji","Samarqand",4.6,.97],["Farg‘ona Bozor","Farg‘ona",4.5,1.03],["Andijon Trade","Andijon",4.7,.95],["Buxoro Market","Buxoro",4.4,1.01]];
const it=[["Un 50 kg","Oziq-ovqat","qop",310000,1],["Shakar 50 kg","Oziq-ovqat","qop",520000,1],["Guruch 25 kg","Oziq-ovqat","qop",330000,1],["Yog‘ 5 L","Oziq-ovqat","dona",78000,4],["Choy 100 paket","Oziq-ovqat","quti",24000,5],["Makaron 20 dona","Oziq-ovqat","quti",42000,3],["Suv 1.5 L (6 dona)","Ichimlik","blok",21000,10],["Shokolad 24 dona","Shirinlik","quti",96000,2],["Sovun 72 dona","Maishiy","quti",150000,1],["Kir yuvish kukuni 3 kg","Maishiy","dona",45000,5],["Salfetka 100 dona","Maishiy","quti",18000,10],["Daftar 48 varaq (10 dona)","Ofis","pachka",38000,5],["Ruchka 50 dona","Ofis","quti",28000,3],["Paypoq 12 juft","Kiyim","pachka",60000,2],["Zaryadka kabel","Elektr","dona",22000,5],["LED lampa 10 dona","Elektr","quti",55000,2]];
const r=[];it.forEach((x,i)=>sh.forEach((s,j)=>{if((i+j)%5==0)return;const b=Math.round(x[3]*s[3]*(1+((i*3+j*7)%5-2)/100)/100)*100,m=x[4];r.push({id:"p"+i+"_"+j,name:x[0],cat:x[1],unit:x[2],shop:s[0],city:s[1],rate:s[2],min:m,stock:60+(i*7+j*13)%190,tiers:[[m,b],[m*10,Math.round(b*.97/100)*100],[m*50,Math.round(b*.93/100)*100]],ts:1})}));return r}
if(!S.market.length)S.market=seed();
const U={t:"bozor",q:"",cat:"Hammasi",shop:"Hammasi",so:"arzon",fav:0},ST=["Yangi","Tasdiqlandi","Yo‘lda","Yetkazildi"];
const up=(p,q)=>{let r=p.tiers[0][1];p.tiers.forEach(t=>{if(q>=t[0])r=t[1]});return r};
const bestMap=()=>{const m={};S.market.forEach(p=>{const k=p.name.toLowerCase(),v=p.tiers[0][1];if(!m[k])m[k]={v,id:p.id,n:0};m[k].n++;if(v<m[k].v){m[k].v=v;m[k].id=p.id}});return m};
const toast=t=>{const e=$("#ts");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",2200)};
const mdl=h=>$("#md").innerHTML=h?`<div class="ov"><div class="sh">${h}</div></div>`:"";
let cb;const ask=(t,d,f)=>{cb=f;mdl(`<b>${t}</b><input id="ak" class="in" inputmode="numeric" value="${d}"><div class="row"><button class="b o" data-a="close">Bekor</button><span class="sp"></span><button class="b" data-a="ok">OK</button></div>`);setTimeout(()=>$("#ak")?.select(),50)};
const bestOf=p=>{const b=bestMap()[p.name.toLowerCase()];return b&&b.n>1&&b.id==p.id};
const card=p=>{const n=S.market.filter(x=>x.name==p.name).length;return `<div class="cd"><div class="top"><div><b>${esc(p.name)}</b><small>${esc(p.shop)}, ${esc(p.city)}, ★${p.rate||"-"}</small></div>${bestOf(p)?'<span class="bd">Eng arzon</span>':""}</div>
<div class="pr">${fmt(p.tiers[0][1])}<small> / ${esc(p.unit)}, minimal ${p.min}</small></div>
<div class="ti">${p.tiers.map(t=>`<span>${t[0]}+ dona: ${fmt(t[1])}</span>`).join("")}</div>
<div class="row"><small>Omborda ${p.stock} ${esc(p.unit)}</small><span class="sp"></span><button class="b o" data-a="fav" data-id="${p.id}">${S.fav.includes(p.id)?"♥":"♡"}</button>${n>1?`<button class="b o" data-a="cmp" data-id="${p.id}">Narxlar (${n})</button>`:""}<button class="b a" data-a="add" data-id="${p.id}">+ Savat</button></div></div>`};
function list(){const q=U.q.toLowerCase();let a=S.market.filter(p=>(U.cat=="Hammasi"||p.cat==U.cat)&&(U.shop=="Hammasi"||p.shop==U.shop)&&(!U.fav||S.fav.includes(p.id))&&(p.name+p.shop+p.city).toLowerCase().includes(q));
const f={arzon:(x,y)=>x.name.localeCompare(y.name)||x.tiers[0][1]-y.tiers[0][1],narx:(x,y)=>x.tiers[0][1]-y.tiers[0][1],min:(x,y)=>x.min-y.min,reyt:(x,y)=>(y.rate||0)-(x.rate||0)};
a.sort(f[U.so]);const e=$("#lst");if(e)e.innerHTML=a.length?a.slice(0,60).map(card).join(""):`<div class="cd">Hech narsa topilmadi. Qidiruvni o‘zgartiring yoki Menyu bo‘limida o‘z mahsulotingizni qo‘shing.</div>`}
const V={};
V.bozor=()=>{const cats=["Hammasi",...new Set(S.market.map(p=>p.cat))],shops=["Hammasi",...new Set(S.market.map(p=>p.shop))];
return `<input id="q" class="in" placeholder="Mahsulot, do‘kon yoki shahar qidiring" value="${esc(U.q)}"><div class="ch">${cats.map(c=>`<button class="chip ${U.cat==c?"on":""}" data-a="cat" data-id="${esc(c)}">${esc(c)}</button>`).join("")}</div>
<div class="row"><select id="sh" class="in">${shops.map(s=>`<option ${U.shop==s?"selected":""}>${esc(s)}</option>`).join("")}</select><select id="so" class="in">${[["arzon","Eng arzon birinchi"],["narx","Narx o‘sish"],["min","Minimal miqdor"],["reyt","Reyting"]].map(o=>`<option value="${o[0]}" ${U.so==o[0]?"selected":""}>${o[1]}</option>`).join("")}</select><button class="b o" data-a="favs">${U.fav?"♥ Sevimli":"♡ Sevimli"}</button></div><div id="lst"></div>`};
const cartRows=()=>Object.keys(S.cart).map(id=>[S.market.find(p=>p.id==id),S.cart[id]]).filter(x=>x[0]);
V.savat=()=>{const r=cartRows();if(!r.length)return `<div class="cd">Savat bo‘sh. Bozor bo‘limidan mahsulot qo‘shing.</div>`;let tot=0,sv=0;
const h=r.map(([p,q])=>{const u=up(p,q);tot+=u*q;sv+=(p.tiers[0][1]-u)*q;const nx=p.tiers.find(t=>t[0]>q);return `<div class="cd"><b>${esc(p.name)}</b><small>${esc(p.shop)}, ${fmt(u)} / ${esc(p.unit)}</small><div class="row"><button class="b o" data-a="dec" data-id="${p.id}">−</button><b>${q}</b><button class="b o" data-a="inc" data-id="${p.id}">+</button><span class="sp"></span><b>${fmt(u*q)}</b></div>${nx?`<small>Yana ${nx[0]-q} ${esc(p.unit)} qo‘shsangiz narx ${fmt(nx[1])} bo‘ladi</small>`:""}</div>`}).join("");
return h+`<div class="cd"><div class="row"><b>Jami</b><span class="sp"></span><b class="pr">${fmt(tot)}</b></div>${sv>0?`<small class="pos">Optom chegirmasi tufayli tejaldi: ${fmt(sv)}</small>`:""}
<input id="cn" class="in" placeholder="Ismingiz" value="${esc(S.cfg.name)}"><input id="cp" class="in" inputmode="tel" placeholder="Telefon" value="${esc(S.cfg.phone)}"><input id="ca" class="in" placeholder="Yetkazish manzili" value="${esc(S.cfg.addr)}">
<div class="row"><button class="b o" data-a="clr">Tozalash</button><span class="sp"></span><button class="b a" data-a="order">Buyurtma berish</button></div></div>`};
V.buy=()=>S.orders.length?S.orders.map(o=>`<div class="cd"><div class="top"><b>#${o.id}</b><b>${fmt(o.total)}</b></div><small>${new Date(o.t).toLocaleString("uz")}</small>${o.items.map(i=>`<div>${esc(i.n)}: ${i.q} × ${fmt(i.u)} <small>${esc(i.shop)}</small></div>`).join("")}
<div class="bar"><i style="width:${(o.st+1)*25}%"></i></div><b>${ST[o.st]}</b><div class="row">${o.st<3?`<button class="b o" data-a="nxt" data-id="${o.id}">Keyingi holat</button>`:`<button class="b" data-a="toWh" data-id="${o.id}">Omborga qo‘shish</button>`}<button class="b o" data-a="rep" data-id="${o.id}">Takrorlash</button>${o.st<2?`<button class="b r" data-a="cx" data-id="${o.id}">Bekor</button>`:""}</div></div>`).join(""):`<div class="cd">Hali buyurtma yo‘q.</div>`;
const day=t=>new Date(t).toDateString();
V.ombor=()=>{const val=S.wh.reduce((a,x)=>a+x.cost*x.qty,0),tp=S.sales.filter(s=>day(s.t)==day(Date.now())).reduce((a,s)=>a+s.pf,0),all=S.sales.reduce((a,s)=>a+s.pf,0);
const d7=[...Array(7)].map((_,i)=>{const t=Date.now()-(6-i)*864e5;return S.sales.filter(s=>day(s.t)==day(t)).reduce((a,s)=>a+s.pf,0)}),mx=Math.max(1,...d7.map(Math.abs));
return `<div class="st"><div class="cd"><small>Ombor qiymati</small><b>${fmt(val)}</b></div><div class="cd"><small>Bugungi foyda</small><b class="${tp<0?"neg":"pos"}">${fmt(tp)}</b></div><div class="cd"><small>Umumiy foyda</small><b>${fmt(all)}</b></div><div class="cd"><small>Mahsulotlar</small><b>${S.wh.length}</b></div></div>
<div class="cd"><small>So‘nggi 7 kun foydasi</small><div class="bars">${d7.map(v=>`<i style="height:${Math.abs(v)/mx*100}%"></i>`).join("")}</div></div>
<div class="cd"><b>Yangi tovar</b><input id="wn" class="in" placeholder="Nomi"><div class="row"><input id="wq" class="in" inputmode="numeric" placeholder="Soni"><input id="wc" class="in" inputmode="numeric" placeholder="Olish narxi"><input id="wp" class="in" inputmode="numeric" placeholder="Sotish narxi"></div><div class="row"><button class="b o" data-a="mic">🎤 Ovozda ayting</button><span class="sp"></span><button class="b" data-a="wadd">Qo‘shish</button></div><small>Masalan: “un 20 310000 340000” (nomi, soni, olish va sotish narxi)</small></div>
${S.wh.map(x=>`<div class="cd"><div class="top"><b>${esc(x.name)}</b><b class="${x.qty<5?"neg":""}">${x.qty} dona</b></div><small>Olish ${fmt(x.cost)}, sotish ${fmt(x.price)}, dona foyda ${fmt(x.price-x.cost)}</small>${x.qty<5?'<small class="neg">Tovar tugayapti, buyurtma bering</small>':""}<div class="row"><button class="b" data-a="sell" data-id="${x.id}">Sotish</button><button class="b o" data-a="rst" data-id="${x.id}">+ Kirim</button><span class="sp"></span><button class="b r" data-a="wdel" data-id="${x.id}">O‘chirish</button></div></div>`).join("")}
<div class="row"><button class="b o" data-a="csv">Hisobotni ulashish</button></div>`};
V.menu=()=>{const c=S.cfg,mine=S.market.filter(p=>p.mine);const f=(k,l,t="")=>`<small>${l}</small><input class="in" data-cfg="${k}" value="${esc(c[k])}" ${t}>`;
return `<div class="cd"><b>Profil</b>${f("shop","Do‘kon nomi")}${f("name","Ismingiz")}${f("phone","Telefon",'inputmode="tel"')}${f("addr","Manzil")}<div class="row"><b>Tungi rejim</b><span class="sp"></span><button class="b o" data-a="dark">${c.dark?"Yoqilgan":"O‘chiq"}</button></div></div>
<div class="cd"><b>Onlayn ulanish</b><small>Firebase Realtime Database manzilini kiriting (masalan https://loyiha-default-rtdb.firebaseio.com). Qoidalarda read/write ruxsat bo‘lsin. Barcha foydalanuvchilar bitta bozorni ko‘radi.</small>${f("db","Baza manzili",'inputmode="url"')}${f("room","Zaxira kodi (maxfiy so‘z)")}<small>Oxirgi sinxron: ${esc(S.last||"hali yo‘q")}</small>
<div class="row"><button class="b" data-a="sync">Sinxronlash</button><button class="b o" data-a="bk">Zaxiraga saqlash</button><button class="b o" data-a="rs">Tiklash</button></div></div>
<div class="cd"><b>Bozorga mahsulot qo‘yish</b><input id="mn" class="in" placeholder="Mahsulot nomi"><div class="row"><input id="mc" class="in" placeholder="Kategoriya"><input id="mu" class="in" placeholder="Birlik (qop, quti)"></div><div class="row"><input id="mp" class="in" inputmode="numeric" placeholder="Narx"><input id="mm" class="in" inputmode="numeric" placeholder="Min. miqdor"><input id="ms" class="in" inputmode="numeric" placeholder="Omborda"></div><button class="b a" data-a="madd">Bozorga chiqarish</button><small>10 dona va undan ko‘pga 3%, 50 dona va undan ko‘pga 7% chegirma avtomatik qo‘shiladi.</small></div>
${mine.length?`<h3>Mening mahsulotlarim</h3>`+mine.map(p=>`<div class="cd"><div class="top"><b>${esc(p.name)}</b><b>${fmt(p.tiers[0][1])}</b></div><div class="row"><small>${p.stock} ${esc(p.unit)}</small><span class="sp"></span><button class="b r" data-a="mdel" data-id="${p.id}">O‘chirish</button></div></div>`).join(""):""}
<div class="row"><button class="b r" data-a="wipe">Hamma ma’lumotni tozalash</button></div>`};
function render(){document.documentElement.dataset.th=S.cfg.dark?"d":"";const on=navigator.onLine&&S.cfg.db;
